{# PAGE: Previous / next page buttons for long lists. #}
{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Prev</a>{% endif %}
  <span class="cur">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
